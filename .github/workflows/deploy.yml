# This is a basic workflow to help you get started with Actions

name: DAB Validate and Deploy

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "feature/dlt" branch
  push:
    branches: [ "feature/dlt" ]
  pull_request:
    branches: [ "feature/dlt" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  DAB-validate:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: setup databricks cli
        uses: databricks/setup-cli@main

      - name: DAB Validation
        env:
          DATABRICKS_HOST: ${{ vars.DAB_DEPLOY }} #DBX HOSTNAME
          DATABRICKS_TOKEN: ${{ secrets.DAB_DEPLOY }} #DBX TOKEN
        run: |
          cd ${{ github.workspace }}/demo
          databricks bundle validate -p lab -t lab


  DAB-deploy:
    runs-on: ubuntu-latest
    needs: DAB-validate
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: setup databricks cli
        uses: databricks/setup-cli@main

      - name: DAB Validation
        env:
          DATABRICKS_HOST: ${{ vars.DAB_DEPLOY }} #DBX HOSTNAME
          DATABRICKS_TOKEN: ${{ secrets.DAB_DEPLOY }} #DBX TOKEN
        run: |
          cd ${{ github.workspace }}/demo
          databricks bundle validate -p lab -t lab

      - name: DAB Deploy
        env:
          DATABRICKS_HOST: ${{ vars.DAB_DEPLOY }} #DBX HOSTNAME
          DATABRICKS_TOKEN: ${{ secrets.DAB_DEPLOY }} #DBX TOKEN
        run: |
          cd ${{ github.workspace }}/demo
          databricks bundle deploy -p lab -t lab --force
