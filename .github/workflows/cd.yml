name: Databricks DAB Deploy
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  CD:
    name: Databricks DAB Deploy
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: setup databricks cli
        uses: databricks/setup-cli@main

      - name: DAB Validation
        env:
          DATABRICKS_HOST: ${{ vars.DAB_DEPLOY }} #DBX HOSTNAME
          DATABRICKS_TOKEN: ${{ secrets.DAB_DEPLOY }} #DBX TOKEN
        run: |
          cd ${{ github.workspace }}/demo
          databricks bundle validate -p lab -t lab

      - name: DAB Deploy
        env:
          DATABRICKS_HOST: ${{ vars.DAB_DEPLOY }} #DBX HOSTNAME
          DATABRICKS_TOKEN: ${{ secrets.DAB_DEPLOY }} #DBX TOKEN
        run: |
          cd ${{ github.workspace }}/demo
          databricks bundle deploy -p lab -t lab --force